networks:
  web:
    external: true

services:
  receptbasen-app:
    build: .
    container_name: receptbasen-app
    restart: unless-stopped
    networks:
      - web
      - default
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      DATABASE_URL: postgres://receptbasen:${RECEPTBASEN_DB_PASSWORD}@receptbasen-db:5432/receptbasen
      DISABLE_EXPLORE_SHELVES: true
      # Run the Solid Queue supervisor inside Puma (single-server deployment)
      SOLID_QUEUE_IN_PUMA: true
    volumes:
      - receptbasen_storage:/rails/storage
    depends_on: [receptbasen-db]

  receptbasen-db:
    image: postgres:16-alpine
    container_name: receptbasen-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: receptbasen
      POSTGRES_USER: receptbasen
      POSTGRES_PASSWORD: ${RECEPTBASEN_DB_PASSWORD}
    volumes:
      - receptbasen_postgres_data:/var/lib/postgresql/data

volumes:
  receptbasen_postgres_data:
  receptbasen_storage:
