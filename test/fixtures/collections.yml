# The auto-created, locked collection every user gets on signup.
favoriter:
  user: one
  name: Favoriter
  locked: true

# A normal, unlocked, user-created collection.
vardagsmat:
  user: one
  name: Vardagsmat
  locked: false

# A second user's own locked collection, so tests can check saving
# behavior isn't accidentally scoped per-user instead of per-collection.
two_favoriter:
  user: two
  name: Favoriter
  locked: true

# A public collection — visible to anyone, including anonymous visitors,
# regardless of ownership or collaborator status.
public_collection:
  user: one
  name: Publika favoriter
  public: true
  locked: false

# A private, unlocked collection with collaborators (see
# collection_collaborators.yml) — exercises accessible_to?/editable_by? for
# viewer vs. editor roles, distinct from ownership.
delad_collection:
  user: one
  name: Delad med vänner
  locked: false
