# An active, usable invite link for the private group.
private_active:
  group: private
  created_by: one
  token: private_active_token

# Revoked — used to test the "link isn't valid anymore" state.
private_revoked:
  group: private
  created_by: one
  token: private_revoked_token
  revoked_at: <%= 1.day.ago %>
